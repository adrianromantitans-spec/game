<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02040b">
<title>NEON DEVORATOR</title>
<style>
:root{--cyan:#49caff;--dark:#02040b;--bottom:env(safe-area-inset-bottom,0px);--left:env(safe-area-inset-left,0px);--right:env(safe-area-inset-right,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--dark);color:white;font-family:Arial,sans-serif;overscroll-behavior:none}
body{position:fixed;inset:0;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;touch-action:none}
#game{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.hidden{display:none!important}
button{cursor:pointer;border:2px solid var(--cyan);border-radius:20px;background:#071b30;color:#66d9ff;font-weight:bold;padding:11px 18px;min-width:130px;touch-action:manipulation}
button.selected,button:active{background:var(--cyan);color:#02111e}
.primary{background:var(--cyan);color:#02111e}
.overlay{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;overflow-y:auto;text-align:center;background:rgba(2,5,16,.94);touch-action:pan-y}
.overlay h1{margin:0 0 10px;font-size:clamp(30px,7vw,54px);color:var(--cyan);text-shadow:0 0 22px #008dff}
#main h1{animation:pulseTitle 2s ease-in-out infinite alternate}
@keyframes pulseTitle{
0%{transform:scale(1);text-shadow:0 0 10px #49caff}
100%{transform:scale(1.05);text-shadow:0 0 25px #49caff,0 0 40px #ff3366}
}
.overlay p{color:#b7c7d6;max-width:420px;line-height:1.5}
.row{display:flex;flex-wrap:wrap;justify-content:center;gap:7px}
.row button{min-width:68px;padding:9px 11px}
label{color:#aac4d7;font-size:13px}
#shopItems{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(350px,90vw)}
.shopItem{background:#0a1425;border:2px solid #3b5366;border-radius:12px;padding:14px 8px;cursor:pointer}
.shopItem.owned{border-color:#36d78e}
.shopItem.selected{border-color:#ffe34d}
.shopItem small{display:block;margin-top:6px;color:#a8b5c4}
#hud{position:fixed;top:12px;left:12px;z-index:5;pointer-events:none;font-size:14px;line-height:1.8;text-shadow:0 0 8px black}
#hud strong{color:var(--cyan)}
#coinsText{color:#ffdb38}
#minimap{position:fixed;top:12px;right:12px;width:90px;height:90px;z-index:5;border:2px solid var(--cyan);border-radius:12px;background:#030a15}
#notice{position:fixed;top:17%;left:50%;transform:translateX(-50%);z-index:40;color:#55ffaa;font-weight:bold;text-align:center;pointer-events:none;text-shadow:0 0 15px #00ff99}
.control{position:fixed;z-index:12;width:58px;height:58px;min-width:0;padding:0;border-radius:50%;background:#071a2cdd;touch-action:none;user-select:none;-webkit-user-select:none}
#pauseBtn{top:115px;right:12px;width:46px;height:46px;color:#ffdb38;border-color:#ffdb38}
#dashBtn{right:calc(15px + var(--right));bottom:calc(18px + var(--bottom))}
#skillBtn{right:calc(15px + var(--right));bottom:calc(89px + var(--bottom));color:#ffe24b;border-color:#ffe24b}
#splitBtn{right:calc(15px + var(--right));bottom:calc(160px + var(--bottom));color:#42ff99;border-color:#42ff99}
#freezeBtn{right:calc(86px + var(--right));bottom:calc(18px + var(--bottom));color:#55ffff;border-color:#55ffff}
#joy{position:fixed;z-index:15;left:calc(18px + var(--left));bottom:calc(25px + var(--bottom));width:132px;height:132px;border:2px solid #49caff88;border-radius:50%;background:#49caff18;box-shadow:0 0 18px #00aaff22;touch-action:none!important;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none}
#joy:after{content:"";position:absolute;inset:12px;border:1px dashed #49caff44;border-radius:50%;pointer-events:none}
#knob{position:absolute;width:54px;height:54px;left:50%;top:50%;margin:-27px 0 0 -27px;border-radius:50%;background:radial-gradient(circle at 30% 25%,#b4f3ff,#168cbd);box-shadow:0 0 16px #49caff88;pointer-events:none;will-change:transform;transform:translate3d(0,0,0)}
@media(max-height:550px){
#joy{width:108px;height:108px;bottom:calc(12px + var(--bottom))}
#dashBtn{bottom:calc(12px + var(--bottom))}
#skillBtn{bottom:calc(77px + var(--bottom))}
#splitBtn{bottom:calc(142px + var(--bottom))}
#freezeBtn{bottom:calc(12px + var(--bottom))}
}
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="minimap" width="90" height="90"></canvas>

<div id="hud">
<strong>NEON DEVORATOR</strong><br>
<span id="sizeLabel">Mărime</span>: <span id="score">15</span> / 200<br>
<span id="coinsText">🪙 <span id="coinsLabel">Monede</span>: <span id="coins">0</span></span><br>
<span id="recordLabel">Record</span>: <span id="record">0</span><br>
<span id="modeHud">CLASSIC</span><br><span id="arcadeHud"></span>
</div>

<div id="notice"></div>
<button class="control" id="pauseBtn">Ⅱ</button>
<button class="control" id="dashBtn">DASH</button>
<button class="control" id="skillBtn">⚡</button>
<button class="control" id="splitBtn">✂</button>
<button class="control" id="freezeBtn">❄</button>
<div id="joy"><div id="knob"></div></div>

<div id="main" class="overlay">
<h1>NEON DEVORATOR</h1>
<p id="mainDescription">Crește, devorează adversarii și domină arena!</p>
<div class="row">
<button class="lang selected" data-lang="ro">RO</button>
<button class="lang" data-lang="en">EN</button>
<button class="lang" data-lang="es">ES</button>
</div>
<button class="primary" id="playBtn">JOACĂ ACUM</button>
<button id="shopBtn">🛒 MAGAZIN</button>
</div>

<div id="options" class="overlay hidden">
<h1 id="optionsTitle">CONFIGURARE</h1>
<label id="modeLabel">MOD DE JOC</label>
<div class="row">
<button class="mode selected" data-mode="classic">Classic</button>
<button class="mode" data-mode="survival">Survival</button>
<button class="mode" data-mode="boss">Boss</button>
<button class="mode" data-mode="pacman">Pac-Cyber</button>
<button class="mode" data-mode="hockey">Neon Hockey</button>
</div>
<label id="abilityLabel">ABILITATE SPECIALĂ</label>
<div class="row">
<button class="skill selected" data-skill="ghost">Ghost</button>
<button class="skill" data-skill="blackhole">Puls G.</button>
<button class="skill" data-skill="giant">Gigant</button>
</div>
<label id="difficultyLabel">DIFICULTATE</label>
<div class="row">
<button class="difficulty" data-diff="easy">EASY</button>
<button class="difficulty selected" data-diff="mid">MID</button>
<button class="difficulty" data-diff="hard">HARD</button>
</div>
<label id="volumeLabel">Volum: 50%</label>
<input id="volume" type="range" min="0" max="100" value="50">
<button class="primary" id="startBtn">START JOC</button>
<button id="backBtn">ÎNAPOI</button>
</div>

<div id="shop" class="overlay hidden">
<h1 id="shopTitle">MAGAZIN</h1>
<div>🪙 <span id="shopCoins">0</span></div>
<div class="row">
<button id="skinsTab" class="selected">Skin-uri</button>
<button id="aurasTab">Aure Speciale</button>
</div>
<div id="shopItems"></div>
<button id="shopBack">ÎNAPOI</button>
</div>

<div id="pause" class="overlay hidden">
<h1 id="pauseTitle">PAUZĂ</h1>
<button class="primary" id="resumeBtn">CONTINUĂ</button>
<button id="quitBtn">MENIU PRINCIPAL</button>
</div>

<div id="gameover" class="overlay hidden">
<h1 id="endTitle">GAME OVER</h1>
<p id="endText">Ai fost devorat!</p>
<button class="primary" id="retryBtn">REÎNCEARCĂ</button>
<button id="endMenuBtn">MENIU PRINCIPAL</button>
</div>

<script>
"use strict";

const $=id=>document.getElementById(id);
const canvas=$("game");
const ctx=canvas.getContext("2d",{alpha:false});
const minimap=$("minimap");
const mctx=minimap.getContext("2d");
const random=(a,b)=>a+Math.random()*(b-a);
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
const distance2=(a,b)=>{
const dx=a.x-b.x,dy=a.y-b.y;
return dx*dx+dy*dy;
};

let W=innerWidth,H=innerHeight,DPR=1;
let quality=1;
let slowFrames=0;
let fastFrames=0;

function resize(){
W=innerWidth;
H=innerHeight;
DPR=Math.min(window.devicePixelRatio||1,1.5)*quality;
canvas.width=Math.round(W*DPR);
canvas.height=Math.round(H*DPR);
canvas.style.width=W+"px";
canvas.style.height=H+"px";
ctx.setTransform(DPR,0,0,DPR,0,0);
ctx.imageSmoothingEnabled=true;
resetJoystick();
}

addEventListener("resize",resize);
addEventListener("orientationchange",resize);

function getSaved(key,fallback){
try{
const value=localStorage.getItem(key);
return value===null?fallback:value;
}catch{return fallback}
}
function save(key,value){
try{localStorage.setItem(key,String(value))}catch{}
}

let coins=Number(getSaved("nd_coins",0))||0;
let mode="classic",difficulty="mid",skill="ghost";
let language=getSaved("nd_language","ro");
let volume=.5;
let skin=getSaved("nd_skin","#44aaff");
let aura=getSaved("nd_aura","none");
let shopTab="skins";

if(!["ro","en","es"].includes(language))language="ro";

const skins=[
{id:"#44aaff",name:"Neon Blue",price:0},
{id:"rainbow",name:"Rainbow",price:0},
{id:"pulse",name:"Pulsator",price:50},
{id:"matrix",name:"Matrix",price:100}
];
const auras=[
{id:"none",name:"None",price:0},
{id:"#ff0055",name:"Red Aura",price:100},
{id:"#00ffcc",name:"Cyan Aura",price:150}
];

const translations={
ro:{
description:"Crește, devorează adversarii și domină arena!",
play:"JOACĂ ACUM",shop:"🛒 MAGAZIN",back:"ÎNAPOI",
shopTitle:"MAGAZIN",skins:"Skin-uri",auras:"Aure Speciale",
options:"CONFIGURARE",gameMode:"MOD DE JOC",
ability:"ABILITATE SPECIALĂ",difficulty:"DIFICULTATE",
start:"START JOC",pause:"PAUZĂ",resume:"CONTINUĂ",
quit:"MENIU PRINCIPAL",retry:"REÎNCEARCĂ",
owned:"DEȚINUT",equipped:"ECHIPAT",size:"Mărime",
coins:"Monede",record:"Record",volume:"Volum",
gameOver:"GAME OVER",win:"VICTORIE!",
lostText:"Ai fost devorat de un adversar mai mare!",
winText:"Ai dominat arena!",bossNotice:"⚠ BOSS APĂRUT!",
notEnough:"Nu ai suficiente monede!",
none:"Fără aură",redAura:"Aura Roșie",cyanAura:"Aura Cyan",
easy:"UȘOR",mid:"MEDIU",hard:"GREU"
},
en:{
description:"Grow, devour smaller opponents and dominate the arena!",
play:"PLAY NOW",shop:"🛒 SHOP",back:"BACK",
shopTitle:"SHOP",skins:"Skins",auras:"Special Auras",
options:"SETTINGS",gameMode:"GAME MODE",
ability:"SPECIAL ABILITY",difficulty:"DIFFICULTY",
start:"START GAME",pause:"PAUSED",resume:"RESUME",
quit:"MAIN MENU",retry:"RETRY",
owned:"OWNED",equipped:"EQUIPPED",size:"Size",
coins:"Coins",record:"Record",volume:"Volume",
gameOver:"GAME OVER",win:"VICTORY!",
lostText:"You were eaten by a larger opponent!",
winText:"You dominated the arena!",bossNotice:"⚠ BOSS APPEARED!",
notEnough:"Not enough coins!",
none:"No Aura",redAura:"Red Aura",cyanAura:"Cyan Aura",
easy:"EASY",mid:"MEDIUM",hard:"HARD"
},
es:{
description:"¡Crece, devora rivales más pequeños y domina la arena!",
play:"JUGAR AHORA",shop:"🛒 TIENDA",back:"ATRÁS",
shopTitle:"TIENDA",skins:"Aspectos",auras:"Auras Especiales",
options:"CONFIGURACIÓN",gameMode:"MODO DE JUEGO",
ability:"HABILIDAD ESPECIAL",difficulty:"DIFICULTAD",
start:"INICIAR JUEGO",pause:"PAUSA",resume:"CONTINUAR",
quit:"MENÚ PRINCIPAL",retry:"REINTENTAR",
owned:"COMPRADO",equipped:"EQUIPADO",size:"Tamaño",
coins:"Monedas",record:"Récord",volume:"Volumen",
gameOver:"FIN DEL JUEGO",win:"¡VICTORIA!",
lostText:"¡Un rival más grande te ha devorado!",
winText:"¡Has dominado la arena!",bossNotice:"⚠ ¡JEFE APARECIÓ!",
notEnough:"¡No tienes suficientes monedas!",
none:"Sin aura",redAura:"Aura Roja",cyanAura:"Aura Cian",
easy:"FÁCIL",mid:"MEDIO",hard:"DIFÍCIL"
}
};
const t=()=>translations[language];

function showScreen(id){
["main","options","shop","pause","gameover"].forEach(name=>
$(name).classList.toggle("hidden",name!==id));
const playing=id===null;
["hud","minimap","pauseBtn","dashBtn","skillBtn","splitBtn","freezeBtn","joy"]
.forEach(name=>$(name).classList.toggle("hidden",!playing));
}

function translateGame(){
const tr=t();
const texts={
mainDescription:tr.description,playBtn:tr.play,shopBtn:tr.shop,
optionsTitle:tr.options,modeLabel:tr.gameMode,
abilityLabel:tr.ability,difficultyLabel:tr.difficulty,
startBtn:tr.start,backBtn:tr.back,shopTitle:tr.shopTitle,
skinsTab:tr.skins,aurasTab:tr.auras,shopBack:tr.back,
pauseTitle:tr.pause,resumeBtn:tr.resume,quitBtn:tr.quit,
retryBtn:tr.retry,endMenuBtn:tr.quit,
sizeLabel:tr.size,coinsLabel:tr.coins,recordLabel:tr.record
};
for(const [id,value] of Object.entries(texts))$(id).textContent=value;
$("volumeLabel").textContent=tr.volume+": "+Math.round(volume*100)+"%";
document.querySelector('[data-diff="easy"]').textContent=tr.easy;
document.querySelector('[data-diff="mid"]').textContent=tr.mid;
document.querySelector('[data-diff="hard"]').textContent=tr.hard;
document.querySelectorAll(".lang").forEach(b=>
b.classList.toggle("selected",b.dataset.lang===language));
document.documentElement.lang=language;
renderShop();
}

document.querySelectorAll(".lang").forEach(b=>b.onclick=()=>{
language=b.dataset.lang;
save("nd_language",language);
translateGame();
sound(700,.08);
});

function owned(item){
return item.price===0||getSaved("nd_owned_"+item.id,"false")==="true";
}
function refreshCoins(){
$("coins").textContent=coins;
$("shopCoins").textContent=coins;
}
function renderShop(){
refreshCoins();
$("skinsTab").classList.toggle("selected",shopTab==="skins");
$("aurasTab").classList.toggle("selected",shopTab==="auras");
const container=$("shopItems");
container.replaceChildren();
for(const item of shopTab==="skins"?skins:auras){
const isOwned=owned(item);
const selected=shopTab==="skins"?skin===item.id:aura===item.id;
const div=document.createElement("div");
div.className="shopItem "+(isOwned?"owned ":"")+(selected?"selected":"");
let name=item.name;
if(item.id==="none")name=t().none;
if(item.id==="#ff0055")name=t().redAura;
if(item.id==="#00ffcc")name=t().cyanAura;
const title=document.createElement("strong");
title.textContent=name;
const info=document.createElement("small");
info.textContent=selected?t().equipped:isOwned?t().owned:"🪙 "+item.price;
div.append(title,info);
div.onclick=()=>{
if(!owned(item)){
if(coins<item.price){notify(t().notEnough);sound(180,.2);return}
coins-=item.price;
save("nd_coins",coins);
save("nd_owned_"+item.id,true);
sound(950,.2);
}
if(shopTab==="skins"){skin=item.id;save("nd_skin",skin)}
else{aura=item.id;save("nd_aura",aura)}
renderShop();
};
container.appendChild(div);
}
}

let noticeTimer;
function notify(message){
$("notice").textContent=message;
clearTimeout(noticeTimer);
noticeTimer=setTimeout(()=>$("notice").textContent="",2200);
}

$("playBtn").onclick=()=>showScreen("options");
$("backBtn").onclick=()=>showScreen("main");
$("shopBtn").onclick=()=>{renderShop();showScreen("shop")};
$("shopBack").onclick=()=>showScreen("main");
$("skinsTab").onclick=()=>{shopTab="skins";renderShop()};
$("aurasTab").onclick=()=>{shopTab="auras";renderShop()};

function choose(selector,property,callback){
document.querySelectorAll(selector).forEach(button=>button.onclick=()=>{
document.querySelectorAll(selector).forEach(b=>b.classList.remove("selected"));
button.classList.add("selected");
callback(button.dataset[property]);
});
}
choose(".mode","mode",v=>{mode=v;updateRecord()});
choose(".difficulty","diff",v=>difficulty=v);
choose(".skill","skill",v=>skill=v);

$("volume").oninput=e=>{
volume=Number(e.target.value)/100;
$("volumeLabel").textContent=t().volume+": "+Math.round(volume*100)+"%";
};

let audioContext;
function sound(freq=600,duration=.1,type="sine"){
if(volume<=0)return;
try{
audioContext||=new(window.AudioContext||window.webkitAudioContext)();
if(audioContext.state==="suspended")audioContext.resume();
const oscillator=audioContext.createOscillator();
const gain=audioContext.createGain();
oscillator.type=type;
oscillator.frequency.value=freq;
gain.gain.setValueAtTime(Math.max(.0001,volume*.09),audioContext.currentTime);
gain.gain.exponentialRampToValueAtTime(.001,audioContext.currentTime+duration);
oscillator.connect(gain);
gain.connect(audioContext.destination);
oscillator.start();
oscillator.stop(audioContext.currentTime+duration);
oscillator.onended=()=>{oscillator.disconnect();gain.disconnect()};
}catch{}
}

let MAP_SIZE=3000;
let running=false,paused=false,player;
let bots=[],food=[],guards=[],walls=[],particles=[];
let frame=0,zoom=1;
let spawnProtection=0,dashCooldown=0,skillCooldown=0;
let skillTimer=0,freezeTimer=0,dashTimer=0,bossSpawned=false;
let coinsDirty=false,recordValue=0;
const arcadeModes=new Set(["hockey"]);
let arcade={};
function arcadeReward(amount){
 coins+=amount;coinsDirty=true;refreshCoins();notify("🪙 +"+amount);
}
function arcadeScore(value){
 const current=Math.floor(value);
 $("score").textContent=current;
 if(current>recordValue){recordValue=current;$("record").textContent=current}
}
function arcadeStatus(text){$("arcadeHud").textContent=text}
function arcadeEnd(win,detail,reward=0){
 if(reward)arcadeReward(reward);
 gameOver(win);
 $("endText").textContent=detail+(reward?" | 🪙 +"+reward:"");
}
function initArcade(){
 arcade={time:0,points:0,wave:1,goals:0,enemyGoals:0,goalCooldown:0,segments:[],puck:null,ring:0};
 $("arcadeHud").textContent="";
 if(mode==="hockey"){
  MAP_SIZE=1000;bots=[];food=[];
  player.x=MAP_SIZE/2;player.y=MAP_SIZE*.77;player.radius=26;player.baseSpeed=6;
  arcade.enemy={x:MAP_SIZE/2,y:MAP_SIZE*.23,radius:28,color:"#ff3355",angle:0};
  resetPuck();
 }
}
function resetPuck(){
 arcade.puck={x:MAP_SIZE/2,y:MAP_SIZE/2,vx:random(-1,1),vy:random(-1,1)};
 arcade.goalCooldown=65;
}


function recordKey(){return "nd_rec_"+mode}
function updateRecord(){
recordValue=Number(getSaved(recordKey(),0))||0;
$("record").textContent=recordValue;
}
function updateScore(){
const current=Math.floor(player.radius);
$("score").textContent=current;
if(current>recordValue){
recordValue=current;
$("record").textContent=current;
if(frame%30===0)save(recordKey(),recordValue);
}
}
function flushProgress(){
if(coinsDirty){save("nd_coins",coins);coinsDirty=false}
if(player)save(recordKey(),Math.max(recordValue,Number(getSaved(recordKey(),0))||0));
}
function createFood(){
return{
x:random(30,MAP_SIZE-30),y:random(30,MAP_SIZE-30),
radius:mode==="pacman"?6:4,
color:Math.random()>.5?"#36ff99":"#ffcc44"
};
}
function createBot(){
return{
x:random(100,MAP_SIZE-100),
y:random(100,MAP_SIZE-100),
radius:Math.random()>.4?random(10,25):random(18,53),
color:["#ff3355","#ffee33","#00ffff","#ff9900","#44ff99","#bb44ff"][Math.floor(Math.random()*6)],
angle:random(0,Math.PI*2),
targetTimer:Math.floor(random(0,12))
};
}
function blocked(x,y,r){
for(const w of walls)
if(x+r>w.x&&x-r<w.x+w.w&&y+r>w.y&&y-r<w.y+w.h)return true;
return false;
}
function spawnPlayer(){
let x=MAP_SIZE/2,y=MAP_SIZE/2;
if(mode==="pacman"&&blocked(x,y,20)){
for(let i=0;i<500;i++){
const nx=random(100,MAP_SIZE-100),ny=random(100,MAP_SIZE-100);
if(!blocked(nx,ny,35)){x=nx;y=ny;break}
}
}
player={x,y,radius:15,color:skin,angle:0,baseSpeed:4.5,trail:[]};
}
function startGame(){
MAP_SIZE=mode==="survival"?2500:mode==="pacman"?2000:3000;
bots=[];food=[];guards=[];walls=[];particles=[];
frame=0;zoom=1;spawnProtection=180;
dashCooldown=0;skillCooldown=0;skillTimer=0;
freezeTimer=0;dashTimer=0;bossSpawned=false;
if(mode==="pacman"){
for(let i=0;i<18;i++)walls.push({
x:(i*350)%MAP_SIZE+100,y:Math.floor(i/4)*400+150,
w:i%2===0?250:40,h:i%2===0?40:250
});
for(let i=0;i<3;i++)guards.push({
x:random(200,MAP_SIZE-200),y:random(200,MAP_SIZE-200),
radius:20,speed:1.5+i*.2,angle:0
});
}else{
for(let i=0;i<(mode==="survival"?35:22);i++)bots.push(createBot());
}
for(let i=0;i<(mode==="pacman"?120:380);i++)food.push(createFood());
spawnPlayer();
if(arcadeModes.has(mode))initArcade();else arcadeStatus("");
running=true;paused=false;
$("modeHud").textContent=mode.toUpperCase();
updateRecord();updateScore();refreshCoins();
showScreen(null);resetJoystick();
}
$("startBtn").onclick=startGame;
$("retryBtn").onclick=startGame;

function gameOver(win=false){
flushProgress();
running=false;resetJoystick();
$("endTitle").textContent=win?t().win:t().gameOver;
$("endText").textContent=win?t().winText:t().lostText;
sound(win?1100:180,.35,"sawtooth");
showScreen("gameover");
}
$("endMenuBtn").onclick=()=>showScreen("main");
$("pauseBtn").onclick=()=>{
if(!running)return;
paused=true;flushProgress();resetJoystick();showScreen("pause");
};
$("resumeBtn").onclick=()=>{
paused=false;resetJoystick();showScreen(null);
};
$("quitBtn").onclick=()=>{
flushProgress();running=false;paused=false;
resetJoystick();showScreen("main");
};

const joyElement=$("joy"),knob=$("knob");
const joystick={active:false,pointerId:null,touchId:null,x:0,y:0};

function resetJoystick(){
joystick.active=false;
joystick.pointerId=null;
joystick.touchId=null;
joystick.x=0;joystick.y=0;
if(knob)knob.style.transform="translate3d(0,0,0)";
}
function setJoystickPosition(clientX,clientY){
const rect=joyElement.getBoundingClientRect();
const cx=rect.left+rect.width/2;
const cy=rect.top+rect.height/2;
const max=Math.max(20,rect.width/2-28);
let dx=clientX-cx,dy=clientY-cy;
const length=Math.hypot(dx,dy);
if(length>max){dx=dx/length*max;dy=dy/length*max}
joystick.x=dx/max;joystick.y=dy/max;
if(Math.hypot(joystick.x,joystick.y)<.09){
joystick.x=0;joystick.y=0;
}
knob.style.transform=`translate3d(${joystick.x*max}px,${joystick.y*max}px,0)`;
}
// Android WebView / APK: touch events are the primary control path.
// The finger remains tracked even if it moves outside the joystick circle.
function joystickTouchStart(e){
 if(!running||paused||joystick.active)return;
 const touch=e.changedTouches[0];
 if(!touch)return;
 e.preventDefault();e.stopPropagation();
 joystick.active=true;
 joystick.touchId=touch.identifier;
 setJoystickPosition(touch.clientX,touch.clientY);
}
function joystickTouchMove(e){
 if(!joystick.active||joystick.touchId===null)return;
 for(const touch of e.changedTouches){
  if(touch.identifier===joystick.touchId){
   e.preventDefault();
   setJoystickPosition(touch.clientX,touch.clientY);
   break;
  }
 }
}
function joystickTouchEnd(e){
 if(!joystick.active||joystick.touchId===null)return;
 for(const touch of e.changedTouches){
  if(touch.identifier===joystick.touchId){
   e.preventDefault();
   resetJoystick();
   break;
  }
 }
}
joyElement.addEventListener("touchstart",joystickTouchStart,{passive:false});
document.addEventListener("touchmove",joystickTouchMove,{passive:false});
document.addEventListener("touchend",joystickTouchEnd,{passive:false});
document.addEventListener("touchcancel",joystickTouchEnd,{passive:false});

// Mouse fallback for desktop; ignore synthesized mouse events after touch.
let lastTouchTime=0;
joyElement.addEventListener("touchstart",()=>{lastTouchTime=Date.now()},{passive:true});
joyElement.addEventListener("mousedown",e=>{
 if(Date.now()-lastTouchTime<800||!running||paused||e.button!==0)return;
 e.preventDefault();
 joystick.active=true;
 joystick.pointerId="mouse";
 setJoystickPosition(e.clientX,e.clientY);
});
document.addEventListener("mousemove",e=>{
 if(joystick.active&&joystick.pointerId==="mouse")setJoystickPosition(e.clientX,e.clientY);
});
document.addEventListener("mouseup",()=>{
 if(joystick.pointerId==="mouse")resetJoystick();
});
joyElement.addEventListener("contextmenu",e=>e.preventDefault());

let keys={};
addEventListener("blur",()=>{keys={};resetJoystick()});
document.addEventListener("visibilitychange",()=>{
if(document.hidden){
keys={};resetJoystick();
if(running)flushProgress();
}
});
addEventListener("keydown",e=>{
keys[e.key.toLowerCase()]=true;
if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight"," "].includes(e.key))
e.preventDefault();
if(e.repeat)return;
if(e.key===" ")activateDash();
if(e.key.toLowerCase()==="q")activateSkill();
if(e.key.toLowerCase()==="f")activateFreeze();
});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);

function activateDash(){
if(!running||paused||dashCooldown>0)return;
dashCooldown=300;dashTimer=18;sound(650,.12,"square");
}
function activateSplit(){
if(!running||paused||player.radius<=25)return;
player.radius-=5;dashTimer=15;sound(500,.2,"sawtooth");
}
function activateFreeze(){
if(!running||paused)return;
freezeTimer=120;sound(850,.3);
}
function activateSkill(){
if(!running||paused||skillCooldown>0)return;
skillCooldown=600;skillTimer=300;
if(skill==="blackhole"){
for(const b of bots){
const dx=player.x-b.x,dy=player.y-b.y;
const d=Math.hypot(dx,dy)||1;
if(d<450){b.x+=dx/d*90;b.y+=dy/d*90}
}
}
sound(900,.3);
}
function bindAction(id,fn){
const el=$(id);
if(window.PointerEvent){
el.addEventListener("pointerdown",e=>{
if(e.pointerType==="mouse"&&e.button!==0)return;
e.preventDefault();e.stopPropagation();fn();
});
}else{
el.addEventListener("touchstart",e=>{
e.preventDefault();e.stopPropagation();fn();
},{passive:false});
el.addEventListener("click",fn);
}
el.addEventListener("contextmenu",e=>e.preventDefault());
}
bindAction("dashBtn",activateDash);
bindAction("splitBtn",activateSplit);
bindAction("freezeBtn",activateFreeze);
bindAction("skillBtn",activateSkill);

// GRAFICĂ OPTIMIZATĂ
const TAU=Math.PI*2;
const orbCache=new Map();
const foodCache=new Map();

function orbColor(c){
if(c==="rainbow")return `hsl(${frame*2%360},100%,55%)`;
if(c==="pulse")return `hsl(190,100%,${50+Math.sin(frame*.08)*15}%)`;
if(c==="matrix")return "#00ff66";
return c;
}

// Pregătim sferele o singură dată, nu la fiecare cadru.
function makeOrbSprite(color){
const size=128;
const off=document.createElement("canvas");
off.width=size;off.height=size;
const g=off.getContext("2d");
const x=64,y=64,r=54;
const gradient=g.createRadialGradient(x-19,y-23,3,x+7,y+10,67);
gradient.addColorStop(0,"#ffffff");
gradient.addColorStop(.18,color);
gradient.addColorStop(.6,color);
gradient.addColorStop(1,"#030713");
g.fillStyle=gradient;
g.beginPath();g.arc(x,y,r,0,TAU);g.fill();
g.strokeStyle="#ffffff55";g.lineWidth=2;
g.stroke();
g.fillStyle="#ffffff55";
g.beginPath();g.ellipse(x-17,y-23,13,6,-.5,0,TAU);g.fill();
return off;
}
function getOrbSprite(c){
if(!orbCache.has(c)){
if(orbCache.size>48)orbCache.clear();
orbCache.set(c,makeOrbSprite(c));
}
return orbCache.get(c);
}
function drawOrb3D(x,y,r,c,angle=0,eyes=true){
if(r<.6)return;
c=orbColor(c);
const size=r*2.38;
ctx.drawImage(getOrbSprite(c),x-size/2,y-size/2,size,size);
if(!eyes||r<5)return;
const fx=Math.cos(angle),fy=Math.sin(angle);
for(const side of [-1,1]){
const ex=x+fx*r*.34-fy*side*r*.32;
const ey=y+fy*r*.34+fx*side*r*.32;
ctx.fillStyle="#ffffff";
ctx.beginPath();ctx.ellipse(ex,ey,r*.19,r*.22,0,0,TAU);ctx.fill();
ctx.fillStyle="#06101c";
ctx.beginPath();ctx.arc(ex+fx*r*.07,ey+fy*r*.07,r*.095,0,TAU);ctx.fill();
}
}
function drawFood3D(x,y,r,color){
if(r<1)return;
ctx.fillStyle=color;
ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();
if(r>=3){
ctx.fillStyle="#ffffffaa";
ctx.beginPath();
ctx.arc(x-r*.28,y-r*.28,Math.max(.7,r*.2),0,TAU);
ctx.fill();
}
}

function drawFloor(){
const bg=ctx.createLinearGradient(0,0,0,H);
bg.addColorStop(0,"#0a1122");
bg.addColorStop(1,"#02040b");
ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
const spacing=Math.max(35,100*zoom);
const ox=((-player.x*zoom)%spacing+spacing)%spacing;
const oy=((-player.y*zoom)%spacing+spacing)%spacing;
ctx.strokeStyle="#22a5e526";
ctx.lineWidth=1;
ctx.beginPath();
for(let x=ox;x<W;x+=spacing){ctx.moveTo(x,0);ctx.lineTo(x,H)}
for(let y=oy;y<H;y+=spacing){ctx.moveTo(0,y);ctx.lineTo(W,y)}
ctx.stroke();
}
function screenX(x){return(x-player.x)*zoom+W/2}
function screenY(y){return(y-player.y)*zoom+H/2}
function visible(x,y,r=30){
return x>-r&&y>-r&&x<W+r&&y<H+r;
}
function drawWalls(){
for(const w of walls){
const x=screenX(w.x),y=screenY(w.y);
const ww=w.w*zoom,hh=w.h*zoom;
if(x>W||y>H||x+ww<0||y+hh<0)continue;
const depth=Math.max(4,12*zoom);
ctx.fillStyle="#101629";
ctx.fillRect(x,y,ww,hh);
ctx.fillStyle="#30334f";
ctx.beginPath();
ctx.moveTo(x,y);
ctx.lineTo(x+depth,y-depth);
ctx.lineTo(x+ww+depth,y-depth);
ctx.lineTo(x+ww,y);
ctx.closePath();ctx.fill();
ctx.strokeStyle="#ff26e9";
ctx.lineWidth=Math.max(1,2*zoom);
ctx.strokeRect(x,y,ww,hh);
}
}
function burst(x,y,color,count=8){
const max=quality<1?5:count;
for(let i=0;i<max;i++)particles.push({
x,y,vx:random(-4,4),vy:random(-4,4),life:25,color
});
}
function movePlayer(){
let dx=joystick.active?joystick.x:0;
let dy=joystick.active?joystick.y:0;
if(keys.w||keys.arrowup)dy=-1;
if(keys.s||keys.arrowdown)dy=1;
if(keys.a||keys.arrowleft)dx=-1;
if(keys.d||keys.arrowright)dx=1;
const length=Math.hypot(dx,dy);
if(length>0){dx/=length;dy/=length;player.angle=Math.atan2(dy,dx)}
if(mode==="snake"){
 if(length>0){
  const old=arcade.lastDir;
  if(dx*old.x+dy*old.y>-.65)arcade.lastDir={x:dx,y:dy};
 }
 dx=arcade.lastDir.x;dy=arcade.lastDir.y;
}
let speed=player.baseSpeed;
if(dashTimer>0)speed*=2.2;
if(skill==="giant"&&skillTimer>0)speed*=.8;
const nx=clamp(player.x+dx*speed,player.radius,MAP_SIZE-player.radius);
const ny=clamp(player.y+dy*speed,player.radius,MAP_SIZE-player.radius);
const oldX=player.x,oldY=player.y;
if(!blocked(nx,player.y,player.radius))player.x=nx;
if(!blocked(player.x,ny,player.radius))player.y=ny;
if(mode==="hockey"){
 player.x=clamp(player.x,90,MAP_SIZE-90);
 player.y=clamp(player.y,MAP_SIZE*.52,MAP_SIZE-90);
}
// Urma neon exista DOAR cat timp personajul se deplaseaza.
const moving=Math.hypot(player.x-oldX,player.y-oldY)>0.01;
if(!moving){
player.trail.length=0;
}else{
if(frame%2===0){
player.trail.push({x:oldX,y:oldY,radius:player.radius,life:18});
if(player.trail.length>12)player.trail.shift();
}
for(let i=player.trail.length-1;i>=0;i--){
player.trail[i].life--;
if(player.trail[i].life<=0)player.trail.splice(i,1);
}
}
}

// COLIZIUNI RAPIDE: evităm sqrt pentru fiecare punct.
function updateFood(){
let collected=0;
for(let i=food.length-1;i>=0;i--){
const f=food[i];
const dx=player.x-f.x,dy=player.y-f.y;
const reach=player.radius+f.radius;
if(dx*dx+dy*dy<reach*reach){
player.radius+=mode==="pacman"?.5:.25;
coins++;collected++;
burst(f.x,f.y,f.color,4);
if(mode==="pacman")food.splice(i,1);
else food[i]=createFood();
}
}
if(collected){
coinsDirty=true;
refreshCoins();
if(frame%6===0)sound(1000,.045);
}
}
function updateBots(){
const multiplier=difficulty==="easy"?.6:difficulty==="hard"?1.2:.9;
for(let i=bots.length-1;i>=0;i--){
const b=bots[i];
const speed=Math.max(.6,18/b.radius*multiplier);
const d2=distance2(player,b);
if(spawnProtection===0&&b.radius>player.radius*1.05&&d2<160000){
b.angle=Math.atan2(player.y-b.y,player.x-b.x);
}else if(player.radius>b.radius*1.05&&d2<62500){
b.angle=Math.atan2(b.y-player.y,b.x-player.x);
}else if(--b.targetTimer<=0){
b.targetTimer=8+Math.floor(random(0,10));
let closest=null,best=40000;
for(const f of food){
const fd=distance2(b,f);
if(fd<best){best=fd;closest=f}
}
if(closest)b.angle=Math.atan2(closest.y-b.y,closest.x-b.x);
else b.angle+=random(-.6,.6);
}
if(freezeTimer===0){
b.x+=Math.cos(b.angle)*speed;
b.y+=Math.sin(b.angle)*speed;
}
b.x=clamp(b.x,b.radius,MAP_SIZE-b.radius);
b.y=clamp(b.y,b.radius,MAP_SIZE-b.radius);

// Boții verifică hrana doar o dată la 3 cadre.
if(frame%3===i%3){
for(let j=0;j<food.length;j++){
const f=food[j],reach=b.radius+f.radius;
if(distance2(b,f)<reach*reach){
b.radius+=.15;
food[j]=createFood();
break;
}
}
}
const reach=player.radius+b.radius;
if(spawnProtection===0&&distance2(player,b)<reach*reach){
if(player.radius>b.radius*1.05){
player.radius+=b.radius*.35;
burst(b.x,b.y,b.color,14);
bots[i]=createBot();
sound(1200,.14);
}else if(b.radius>player.radius*1.05&&!(skill==="ghost"&&skillTimer>0)){
gameOver(false);return;
}
}
}
}
function updateGuards(){
for(const g of guards){
g.angle=Math.atan2(player.y-g.y,player.x-g.x);
if(freezeTimer===0){
const nx=g.x+Math.cos(g.angle)*g.speed;
const ny=g.y+Math.sin(g.angle)*g.speed;
if(!blocked(nx,ny,g.radius)){g.x=nx;g.y=ny}
}
const reach=g.radius+player.radius;
if(spawnProtection===0&&distance2(g,player)<reach*reach&&
!(skill==="ghost"&&skillTimer>0)){
gameOver(false);return;
}
}
}
function updateParticles(){
for(let i=particles.length-1;i>=0;i--){
const p=particles[i];
p.x+=p.vx;p.y+=p.vy;
p.vx*=.96;p.vy*=.96;p.life--;
if(p.life<=0)particles.splice(i,1);
}
}
function updateGame(){
frame++;
if(spawnProtection>0)spawnProtection--;
if(dashCooldown>0)dashCooldown--;
if(skillCooldown>0)skillCooldown--;
if(skillTimer>0)skillTimer--;
if(freezeTimer>0)freezeTimer--;
if(dashTimer>0)dashTimer--;
movePlayer();
if(arcadeModes.has(mode)){
 updateArcade();
 if(running){updateParticles();if(frame%120===0)flushProgress()}
 return;
}
updateFood();
if(mode==="pacman")updateGuards();
else updateBots();
if(!running)return;
updateParticles();
if(mode==="boss"&&!bossSpawned&&frame>600){
const boss=createBot();
boss.radius=85;boss.color="#ff0044";
boss.x=clamp(player.x+350,100,MAP_SIZE-100);
boss.y=clamp(player.y+350,100,MAP_SIZE-100);
bots.push(boss);
bossSpawned=true;notify(t().bossNotice);
}
const targetZoom=Math.max(.25,30/player.radius);
zoom+=(targetZoom-zoom)*.1;
updateScore();
if(player.radius>=200||(mode==="pacman"&&food.length===0)){
gameOver(true);return;
}
if(frame%15===0){
$("dashBtn").style.opacity=dashCooldown>0?".5":"1";
$("skillBtn").style.opacity=skillCooldown>0?".5":"1";
}
if(frame%120===0)flushProgress();
}
function drawGame(){
drawFloor();
if(arcadeModes.has(mode))drawArcadeExtras(false);
if(mode==="pacman")drawWalls();
for(const trail of player.trail){
const x=screenX(trail.x),y=screenY(trail.y);
ctx.globalAlpha=Math.max(0,trail.life/18)*.52;
ctx.fillStyle="#44aaff";
ctx.beginPath();
ctx.arc(x,y,trail.radius*.72*zoom,0,TAU);
ctx.fill();
}
ctx.globalAlpha=1;
for(const f of food){
const x=screenX(f.x),y=screenY(f.y);
const r=Math.max(1.5,f.radius*zoom);
if(visible(x,y,r))drawFood3D(x,y,r,f.color);
}
for(const b of bots){
const x=screenX(b.x),y=screenY(b.y),r=b.radius*zoom;
if(visible(x,y,r))drawOrb3D(x,y,r,b.color,b.angle);
}
if(mode==="hockey"&&arcade.enemy){
 const e=arcade.enemy;drawOrb3D(screenX(e.x),screenY(e.y),e.radius*zoom,e.color,e.angle);
}
for(const g of guards){
const x=screenX(g.x),y=screenY(g.y),r=g.radius*zoom;
if(visible(x,y,r))drawOrb3D(x,y,r,"#ff0033",g.angle);
}
for(const p of particles){
const x=screenX(p.x),y=screenY(p.y);
if(!visible(x,y,4))continue;
ctx.globalAlpha=Math.max(0,p.life/25);
ctx.fillStyle=p.color;
ctx.fillRect(x,y,Math.max(2,3*zoom),Math.max(2,3*zoom));
}
ctx.globalAlpha=1;
const cx=W/2,cy=H/2;
let r=player.radius*zoom;
if(skill==="giant"&&skillTimer>0)r*=1.5;
if(spawnProtection>0){
ctx.strokeStyle="#00ffff";
ctx.lineWidth=3;
ctx.beginPath();
ctx.arc(cx,cy,r+10+Math.sin(frame*.1)*4,0,TAU);
ctx.stroke();
}
if(aura!=="none"){
ctx.strokeStyle=aura;
ctx.lineWidth=4;
ctx.beginPath();
ctx.arc(cx,cy,r+14,0,TAU);
ctx.stroke();
}
if(skill==="ghost"&&skillTimer>0)ctx.globalAlpha=.48;
drawOrb3D(cx,cy,r,player.color,player.angle);
ctx.globalAlpha=1;
if(arcadeModes.has(mode))drawArcadeExtras(true);
if(frame%4===0)drawMinimap();
}
function drawMinimap(){
mctx.fillStyle="#030814";
mctx.fillRect(0,0,90,90);
const scale=90/MAP_SIZE;
mctx.fillStyle="#ff3355";
for(const b of bots)mctx.fillRect(b.x*scale,b.y*scale,2,2);
for(const g of guards)mctx.fillRect(g.x*scale,g.y*scale,3,3);
mctx.fillStyle="#49caff";
mctx.fillRect(player.x*scale-2,player.y*scale-2,4,4);
}


// CINCI MINIGAME-URI NEON ARCADE
function updateArcade(){
 arcade.time++;
 if(dashCooldown>0)dashCooldown--;
 if(skillCooldown>0)skillCooldown--;
 if(skillTimer>0)skillTimer--;
 if(freezeTimer>0)freezeTimer--;
 if(dashTimer>0)dashTimer--;
 if(spawnProtection>0)spawnProtection--;
 if(mode==="rush"){
  let picked=0;
  for(let i=food.length-1;i>=0;i--){
   const f=food[i],rr=player.radius+f.radius;
   if(distance2(player,f)<rr*rr){food[i]=createFood();picked++}
  }
  if(picked){arcade.points+=picked;coins+=picked;coinsDirty=true;refreshCoins();sound(850,.035)}
  arcadeScore(arcade.points);
  const left=Math.max(0,45-Math.floor(arcade.time/60));
  arcadeStatus("⚡ "+left+"s | Energie: "+arcade.points);
  if(left===0)arcadeEnd(arcade.points>=35,"Energie colectată: "+arcade.points,Math.floor(arcade.points/3));
 }else if(mode==="neonsurvivor"){
  if(arcade.time%600===0){
   arcade.wave++;
   for(let i=0;i<4+arcade.wave*2;i++){
    const b=createBot();b.radius=random(12,24+arcade.wave*2);
    bots.push(b);
   }
   notify("VALUL "+arcade.wave);
  }
  updateFood();
  updateBots();
  if(!running)return;
  arcadeScore(Math.floor(arcade.time/60));
  arcadeStatus("🛡 Val "+arcade.wave+" | "+Math.floor(arcade.time/60)+"/90s");
  if(arcade.time>=5400)arcadeEnd(true,"Ai supraviețuit 90 de secunde!",120);
 }else if(mode==="snake"){
  const segments=arcade.segments;
  segments.unshift({x:player.x,y:player.y});
  while(segments.length>arcade.snakeLength)segments.pop();
  for(let i=food.length-1;i>=0;i--){
   if(distance2(player,food[i])<400){
    food[i]=createFood();arcade.points++;arcade.snakeLength+=7;
    coins++;coinsDirty=true;refreshCoins();sound(920,.05);
   }
  }
  if(arcade.time>90){
   for(let i=25;i<segments.length;i+=2){
    const dx=player.x-segments[i].x,dy=player.y-segments[i].y;
    if(dx*dx+dy*dy<130){arcadeEnd(false,"Ai atins propria coadă!",Math.floor(arcade.points/2));return}
   }
  }
  arcadeScore(arcade.points);
  arcadeStatus("🐍 Energie: "+arcade.points+" | Coadă: "+arcade.snakeLength);
  if(arcade.points>=25)arcadeEnd(true,"Ai crescut șarpele neon!",80);
 }else if(mode==="hockey"){
  const p=arcade.puck,e=arcade.enemy;
  if(arcade.goalCooldown>0)arcade.goalCooldown--;
  const difficultySpeed=difficulty==="hard"?4.2:difficulty==="easy"?2.4:3.2;
  const targetX=clamp(p.x,90,MAP_SIZE-90),targetY=clamp(p.y-65,90,MAP_SIZE*.46);
  const ex=targetX-e.x,ey=targetY-e.y,ed=Math.hypot(ex,ey)||1;
  e.x+=ex/ed*Math.min(difficultySpeed,ed);
  e.y+=ey/ed*Math.min(difficultySpeed,ed);
  e.x=clamp(e.x,90,MAP_SIZE-90);e.y=clamp(e.y,90,MAP_SIZE*.46);
  for(const [orb,power] of [[player,1],[e,1.1]]){
   const dx=p.x-orb.x,dy=p.y-orb.y,dist=Math.hypot(dx,dy)||1;
   if(dist<orb.radius+15){
    p.vx=dx/dist*(7*power)+(orb===player?(joystick.x||0)*3:0);
    p.vy=dy/dist*(7*power)+(orb===player?(joystick.y||0)*3:0);
    p.x=orb.x+dx/dist*(orb.radius+16);p.y=orb.y+dy/dist*(orb.radius+16);
   }
  }
  if(arcade.goalCooldown===0){p.x+=p.vx;p.y+=p.vy}
  p.vx*=.995;p.vy*=.995;
  if(p.x<70||p.x>MAP_SIZE-70){p.x=clamp(p.x,70,MAP_SIZE-70);p.vx*=-.9}
  if(p.y<60||p.y>MAP_SIZE-60){
   if(Math.abs(p.x-MAP_SIZE/2)<145&&arcade.goalCooldown===0){
    if(p.y<60){arcade.goals++;notify("GOL! +1")}
    else{arcade.enemyGoals++;notify("GOL ADVERSAR!")}
    resetPuck();player.x=MAP_SIZE/2;player.y=MAP_SIZE*.77;
   }else{p.y=clamp(p.y,60,MAP_SIZE-60);p.vy*=-.9}
  }
  arcadeScore(arcade.goals);
  arcadeStatus("🏒 TU "+arcade.goals+" : "+arcade.enemyGoals+" AI");
  if(arcade.goals>=5||arcade.enemyGoals>=5){
   const won=arcade.goals>=5;
   arcadeEnd(won,won?"Ai câștigat meciul!":"AI a câștigat meciul!",won?90:10);
  }
 }else if(mode==="royale"){
  arcade.ring=Math.max(170,MAP_SIZE*.68-arcade.time*.11);
  const center=MAP_SIZE/2;
  const pd=Math.hypot(player.x-center,player.y-center);
  if(pd>arcade.ring&&arcade.time%20===0){
   player.radius-=1.2;
   if(player.radius<9){arcadeEnd(false,"Zona electrică te-a eliminat!");return}
  }
  for(let i=bots.length-1;i>=0;i--){
   const b=bots[i];
   if(freezeTimer===0){
    const dx=center-b.x,dy=center-b.y,d=Math.hypot(dx,dy)||1;
    if(d>arcade.ring*.85){b.x+=dx/d*2.7;b.y+=dy/d*2.7}
    else{b.angle+=random(-.16,.16);b.x+=Math.cos(b.angle)*1.9;b.y+=Math.sin(b.angle)*1.9}
   }
   if(Math.hypot(b.x-center,b.y-center)>arcade.ring+55){bots.splice(i,1);continue}
   const r=player.radius+b.radius;
   if(spawnProtection===0&&distance2(player,b)<r*r){
    if(player.radius>b.radius*1.06){bots.splice(i,1);player.radius+=2;arcade.points++;sound(920,.06)}
    else if(b.radius>player.radius*1.06&&!(skill==="ghost"&&skillTimer>0)){
     arcadeEnd(false,"Ai fost eliminat din NEON ROYALE!");return;
    }
   }
  }
  if(arcade.time%90===0){
   for(let i=0;i<bots.length;i++)for(let j=i+1;j<bots.length;j++){
    const a=bots[i],b=bots[j],r=a.radius+b.radius;
    if(distance2(a,b)<r*r){bots.splice(a.radius>=b.radius?j:i,1);i=-1;break}
   }
  }
  arcadeScore(20-bots.length);
  arcadeStatus("👑 Rămași: "+(bots.length+1)+"/20 | Zonă: "+Math.round(arcade.ring));
  if(bots.length===0)arcadeEnd(true,"Ești ultimul supraviețuitor!",150);
 }
 if(running){
  const targetZoom=mode==="hockey"?Math.min(W,H)/1100:Math.max(.38,30/player.radius);
  zoom+=(targetZoom-zoom)*.08;
  if(frame%15===0){$("dashBtn").style.opacity=dashCooldown>0?".5":"1";$("skillBtn").style.opacity=skillCooldown>0?".5":"1"}
 }
}
function drawArcadeExtras(foreground){
 if(mode==="snake"&&foreground){
  const seg=arcade.segments;
  ctx.strokeStyle="#00eaff";ctx.lineWidth=Math.max(5,player.radius*zoom*1.15);
  ctx.lineCap="round";ctx.lineJoin="round";
  if(seg.length>1){ctx.beginPath();ctx.moveTo(screenX(seg[0].x),screenY(seg[0].y));
   for(let i=1;i<seg.length;i++)ctx.lineTo(screenX(seg[i].x),screenY(seg[i].y));ctx.stroke()}
 }
 if(mode==="hockey"){
  if(!foreground){
   const x=screenX(60),y=screenY(60),sz=(MAP_SIZE-120)*zoom;
   ctx.strokeStyle="#49caff";ctx.lineWidth=3;ctx.strokeRect(x,y,sz,sz);
   ctx.beginPath();ctx.moveTo(x,y+sz/2);ctx.lineTo(x+sz,y+sz/2);ctx.stroke();
   ctx.beginPath();ctx.arc(screenX(MAP_SIZE/2),screenY(MAP_SIZE/2),100*zoom,0,TAU);ctx.stroke();
   ctx.strokeStyle="#ffdd44";ctx.lineWidth=8;
   ctx.beginPath();ctx.moveTo(screenX(MAP_SIZE/2-145),screenY(60));ctx.lineTo(screenX(MAP_SIZE/2+145),screenY(60));ctx.stroke();
   ctx.beginPath();ctx.moveTo(screenX(MAP_SIZE/2-145),screenY(MAP_SIZE-60));ctx.lineTo(screenX(MAP_SIZE/2+145),screenY(MAP_SIZE-60));ctx.stroke();
  }else if(arcade.puck){
   const p=arcade.puck;drawOrb3D(screenX(p.x),screenY(p.y),14*zoom,"#ffe94a",0,false);
  }
 }
 if(mode==="royale"&&!foreground){
  ctx.beginPath();ctx.arc(screenX(MAP_SIZE/2),screenY(MAP_SIZE/2),arcade.ring*zoom,0,TAU);
  ctx.strokeStyle="#ff375c";ctx.lineWidth=6;ctx.stroke();
 }
}

// MENIU ANIMAT, DAR UȘOR PENTRU TELEFON
const menuOrbs=Array.from({length:14},()=>({
x:random(0,innerWidth),y:random(0,innerHeight),
vx:random(-.6,.6),vy:random(-.6,.6),
radius:random(5,16),
color:["#44aaff","#ff3355","#33ff99","#ffee44"][Math.floor(random(0,4))]
}));
function drawMenuBackground(){
ctx.fillStyle="#02040b";
ctx.fillRect(0,0,W,H);
for(const b of menuOrbs){
b.x+=b.vx;b.y+=b.vy;
if(b.x<0||b.x>W)b.vx*=-1;
if(b.y<0||b.y>H)b.vy*=-1;
drawOrb3D(b.x,b.y,b.radius,b.color,0,false);
}
}

// ANIMAȚIE STABILĂ LA 60 FPS
const STEP=1000/60;
let lastFrame=0,accumulator=0,menuLast=0;
function loop(timestamp){
requestAnimationFrame(loop);
if(!lastFrame){lastFrame=timestamp;return}
let delta=Math.min(timestamp-lastFrame,100);
lastFrame=timestamp;

if(!running){
accumulator=0;
if(timestamp-menuLast>33){
menuLast=timestamp;
drawMenuBackground();
}
return;
}
if(paused){accumulator=0;return}

accumulator+=delta;
let steps=0;
while(accumulator>=STEP&&steps<3&&running){
updateGame();
accumulator-=STEP;
steps++;
}
if(steps===3)accumulator=0;
if(running)drawGame();

// Dacă telefonul este suprasolicitat,
// reducem puțin rezoluția, nu viteza jocului.
if(delta>27){slowFrames++;fastFrames=0}
else if(delta<19){fastFrames++;slowFrames=Math.max(0,slowFrames-1)}
if(slowFrames>90&&quality>0.75){
quality=.75;
slowFrames=0;
resize();
}
if(fastFrames>600&&quality<1){
quality=1;
fastFrames=0;
resize();
}
}

resize();
showScreen("main");
translateGame();
refreshCoins();
updateRecord();
requestAnimationFrame(loop);
</script>

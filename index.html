<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Devorator - Ultimate Edition & Pause</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #05050f;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overscroll-behavior: none;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        
        #ui-top {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #fff;
            pointer-events: none;
            z-index: 10;
        }
        .score-box {
            font-size: 18px;
            font-weight: bold;
            color: #4af;
            text-shadow: 0 0 10px rgba(74, 175, 255, 0.8);
            margin-bottom: 3px;
        }
        .coins-box {
            font-size: 14px;
            color: #ff3;
            text-shadow: 0 0 8px #ff3;
            margin-bottom: 3px;
        }
        .record-box {
            font-size: 13px;
            color: #aaa;
        }
        .buff-box {
            font-size: 13px;
            color: #f3f;
            text-shadow: 0 0 8px #f3f;
            margin-top: 3px;
        }

        #achievementPopup {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 255, 150, 0.2);
            border: 2px solid #3f9;
            color: #3f9;
            padding: 8px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 0 15px rgba(0, 255, 150, 0.5);
            transition: top 0.4s ease;
            z-index: 40;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
        #achievementPopup.show {
            top: 20px;
        }

        #minimap-container {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 100px;
            height: 100px;
            background: rgba(5, 5, 15, 0.8);
            border: 2px solid rgba(74, 175, 255, 0.5);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
            z-index: 10;
            pointer-events: none;
        }
        #minimap {
            width: 100%;
            height: 100%;
        }

        .action-btn {
            position: absolute;
            background: rgba(74, 175, 255, 0.15);
            border: 2px solid #4af;
            border-radius: 50%;
            color: #4af;
            font-weight: bold;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(74, 175, 255, 0.3);
            z-index: 20;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
        }
        .action-btn:active {
            transform: scale(0.95);
        }

        #dashBtnWrapper {
            position: absolute;
            bottom: 50px;
            right: 20px;
            width: 65px;
            height: 65px;
            z-index: 20;
        }
        #dashBtn {
            width: 100%;
            height: 100%;
            position: relative;
        }
        #dashSvg {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            transform: rotate(-90deg);
            pointer-events: none;
        }

        #pauseBtn {
            position: absolute;
            top: 130px;
            right: 20px;
            width: 45px;
            height: 45px;
            border-color: #ff3;
            color: #ff3;
            font-size: 16px;
            z-index: 25;
        }

        #skillBtn { bottom: 120px; right: 20px; width: 55px; height: 55px; border-color: #ff0; color: #ff0; }
        #splitBtn { bottom: 190px; right: 35px; width: 55px; height: 55px; border-color: #3f9; color: #3f9; }
        #freezeBtn { bottom: 50px; right: 95px; width: 55px; height: 55px; border-color: #0ff; color: #0ff; }

        .menu-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(5, 5, 15, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            z-index: 30;
            backdrop-filter: blur(8px);
            overflow-y: auto;
            padding: 20px;
        }
        
        .menu-overlay h1 {
            font-size: 32px;
            color: #4af;
            text-shadow: 0 0 20px #4af;
            margin: 0 0 10px 0;
            text-align: center;
            animation: pulseTitle 2s infinite alternate;
        }
        @keyframes pulseTitle {
            0% { transform: scale(1); text-shadow: 0 0 10px #4af; }
            100% { transform: scale(1.05); text-shadow: 0 0 25px #4af, 0 0 40px #f36; }
        }

        .menu-btn {
            width: 220px;
            padding: 10px 0;
            margin: 5px 0;
            font-size: 14px;
            font-weight: bold;
            background: rgba(74, 175, 255, 0.1);
            color: #4af;
            border: 2px solid #4af;
            border-radius: 25px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 0 10px rgba(74, 175, 255, 0.2);
            transition: all 0.2s;
        }

        .menu-btn:active, .menu-btn.active {
            background: #4af;
            color: #05050f;
            box-shadow: 0 0 20px rgba(74, 175, 255, 0.8);
        }

        .menu-btn.btn-primary {
            background: #4af;
            color: #05050f;
            font-size: 16px;
            margin-top: 10px;
        }

        .shop-tabs {
            display: flex;
            gap: 6px;
            margin-bottom: 15px;
        }

        .shop-tab-btn {
            padding: 6px 14px;
            font-size: 12px;
            border-radius: 15px;
            border: 1px solid #4af;
            background: rgba(74, 175, 255, 0.1);
            color: #4af;
            cursor: pointer;
            font-weight: bold;
        }

        .shop-tab-btn.active {
            background: #4af;
            color: #05050f;
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 320px;
            margin-bottom: 15px;
            width: 100%;
        }

        .shop-item {
            background: rgba(255,255,255,0.05);
            border: 2px solid #555;
            border-radius: 12px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .shop-item.owned { border-color: #3f9; }
        .shop-item.selected {
            border-color: #ff3;
            box-shadow: 0 0 15px rgba(255,255,0,0.5);
        }
        .shop-item h3 { margin: 0 0 5px 0; font-size: 13px; }
        .shop-item p { margin: 0; font-size: 11px; color: #aaa; }

        .setting-row {
            width: 220px;
            margin: 6px 0;
            text-align: center;
        }
        .setting-row label {
            display: block;
            margin-bottom: 2px;
            color: #aaa;
            font-size: 12px;
        }
        .setting-row input[type="range"] {
            width: 100%;
            accent-color: #4af;
        }

        .achievements-box {
            font-size: 12px;
            color: #3f9;
            background: rgba(0,255,150,0.1);
            border: 1px solid #3f9;
            padding: 8px 12px;
            border-radius: 10px;
            margin-top: 10px;
            max-width: 280px;
            text-align: center;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div id="achievementPopup">🏆 Realizare Deblocată!</div>

    <div id="ui-top">
        <div class="score-box"><span id="uiScoreText">Mărime</span>: <span id="scoreVal">15</span> / 200</div>
        <div class="coins-box">🪙 Monede: <span id="coinsVal">0</span></div>
        <div class="record-box"><span id="uiRecordText">Record</span>: <span id="recordVal">0</span></div>
        <div id="buffStatus" class="buff-box"></div>
    </div>

    <div id="minimap-container">
        <canvas id="minimap"></canvas>
    </div>

    <div id="pauseBtn" class="action-btn">⏸️</div>
    <div id="skillBtn" class="action-btn" title="Abilitate Specială">⚡</div>
    <div id="freezeBtn" class="action-btn">❄️</div>
    <div id="splitBtn" class="action-btn">✂️</div>
    
    <div id="dashBtnWrapper">
        <div id="dashBtn" class="action-btn">DASH</div>
        <svg id="dashSvg" viewBox="0 0 65 65">
            <circle cx="32.5" cy="32.5" r="29" stroke="rgba(255,255,255,0.2)" stroke-width="4" fill="none"/>
            <circle id="dashProgress" cx="32.5" cy="32.5" r="29" stroke="#4af" stroke-width="4" fill="none" stroke-dasharray="182.2" stroke-dashoffset="0"/>
        </svg>
    </div>

    <!-- 1. Ecran Principal -->
    <div id="screen-main" class="menu-overlay">
        <h1 id="mainTitle">NEON DEVORATOR</h1>
        
        <div style="font-size:12px; color:#aaa; margin-bottom:4px;" id="langLabel">LIMBĂ / LANGUAGE</div>
        <div style="display:flex; gap:6px; margin-bottom:12px;">
            <button class="menu-btn lang-btn active" data-lang="ro" style="width:65px; padding:5px 0; font-size:12px;">RO</button>
            <button class="menu-btn lang-btn" data-lang="en" style="width:65px; padding:5px 0; font-size:12px;">EN</button>
            <button class="menu-btn lang-btn" data-lang="es" style="width:65px; padding:5px 0; font-size:12px;">ES</button>
        </div>

        <button id="btnPlayNow" class="menu-btn btn-primary">JOACĂ ACUM</button>
        <button id="btnOpenShop" class="menu-btn" style="border-color:#ff3; color:#ff3;">🛒 MAGAZIN UNIFICAT</button>
    </div>

    <!-- 2. Magazin cu Labels/Tab-uri Separated -->
    <div id="screen-shop" class="menu-overlay hidden">
        <h1 style="color:#ff3; text-shadow: 0 0 20px #ff3;">MAGAZIN</h1>
        
        <!-- Etichete / Tabs -->
        <div class="shop-tabs">
            <button class="shop-tab-btn active" data-tab="skins">Skin-uri</button>
            <button class="shop-tab-btn" data-tab="auras">Aure Speciale</button>
            <button class="shop-tab-btn" data-tab="particles">Particule Urmă</button>
        </div>

        <div class="shop-grid" id="shopGrid"></div>
        <button id="btnCloseShop" class="menu-btn btn-primary">ÎNAPOI</button>
    </div>

    <!-- 3. Ecran Opțiuni & Moduri de Joc -->
    <div id="screen-options" class="menu-overlay hidden">
        <h1 id="optTitle">CONFIGURARE</h1>

        <div style="font-size:11px; color:#aaa; margin-bottom:2px;" id="modeLabel">MOD DE JOC</div>
        <div style="display:flex; gap:4px; margin-bottom:6px; flex-wrap:wrap; justify-content:center;">
            <button class="menu-btn mode-btn active" data-mode="classic" style="width:68px; padding:5px 0; font-size:10px;">Classic</button>
            <button class="menu-btn mode-btn" data-mode="survival" style="width:68px; padding:5px 0; font-size:10px;">Survival</button>
            <button class="menu-btn mode-btn" data-mode="boss" style="width:68px; padding:5px 0; font-size:10px;">Boss</button>
            <button class="menu-btn mode-btn" data-mode="pacman" style="width:68px; padding:5px 0; font-size:10px; border-color:#f0f; color:#f0f;">Pac-Cyber</button>
            <button class="menu-btn mode-btn" data-mode="pvp" style="width:68px; padding:5px 0; font-size:10px;">PvP 2P</button>
        </div>

        <div style="font-size:11px; color:#aaa; margin-bottom:2px;" id="skillChoiceLabel">ABILITATE SPECIALĂ</div>
        <div style="display:flex; gap:4px; margin-bottom:6px;">
            <button class="menu-btn skill-choice-btn active" data-skill="ghost" style="width:68px; padding:5px 0; font-size:10px;">Ghost</button>
            <button class="menu-btn skill-choice-btn" data-skill="blackhole" style="width:68px; padding:5px 0; font-size:10px;">Puls G.</button>
            <button class="menu-btn skill-choice-btn" data-skill="giant" style="width:68px; padding:5px 0; font-size:10px;">Gigant</button>
        </div>

        <div style="font-size:11px; color:#aaa; margin-bottom:2px;" id="diffLabel">DIFICULTATE</div>
        <div style="display:flex; gap:6px; margin-bottom:6px;">
            <button class="menu-btn diff-btn" data-diff="easy" style="width:68px; padding:5px 0; font-size:11px;">EASY</button>
            <button class="menu-btn diff-btn active" data-diff="mid" style="width:68px; padding:5px 0; font-size:11px;">MID</button>
            <button class="menu-btn diff-btn" data-diff="hard" style="width:68px; padding:5px 0; font-size:11px;">HARD</button>
        </div>

        <div class="setting-row" style="margin:2px 0;">
            <label id="volLabel">Volum Sunet: 50%</label>
            <input type="range" id="volumeSlider" min="0" max="100" value="50">
        </div>

        <button id="btnStartGame" class="menu-btn btn-primary">START JOC</button>
        <button id="btnBackToMain" class="menu-btn" style="margin-top:5px; border-color:#aaa; color:#aaa;">ÎNAPOI</button>
    </div>

    <!-- 4. Ecran Pauză -->
    <div id="screen-pause" class="menu-overlay hidden">
        <h1 style="color:#ff3; text-shadow: 0 0 20px #ff3;">JOCUL ESTE PE PAUZĂ</h1>
        <button id="btnResume" class="menu-btn btn-primary">CONTINUĂ JOCUL</button>
        <button id="btnQuitToMenu" class="menu-btn" style="margin-top:10px; border-color:#f36; color:#f36;">MENIU PRINCIPAL</button>
    </div>

    <!-- 5. Ecran Game Over / Victorie -->
    <div id="screen-gameover" class="menu-overlay hidden">
        <h1 id="gameOverTitle">GAME OVER</h1>
        <p id="gameOverSub" style="color:#ccc; margin-bottom:10px; text-align:center;">Ai fost mâncat!</p>
        <div id="achievementsList" class="achievements-box">🏆 Realizări obținute: Niciuna</div>
        <button id="btnRestart" class="menu-btn btn-primary" style="margin-top:15px;">REÎNCEARCĂ</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const minimapCanvas = document.getElementById('minimap');
        const mCtx = minimapCanvas.getContext('2d');

        let MAP_SIZE = 3000;
        let animationFrame;
        let gameRunning = false;
        let isPaused = false;
        let selectedDifficulty = 'mid';
        let selectedMode = 'classic';
        let selectedSkill = 'ghost';
        let currentLang = 'ro';
        let playerSkin = '#4af';
        let playerParticleType = 'original'; // original = trail-ul clasic din codul tău
        let playerAuraColor = 'none'; 
        let activeShopTab = 'skins';
        let audioVolume = 0.5;

        let neonCoins = parseInt(localStorage.getItem('nd_coins')) || 0;
        document.getElementById('coinsVal').innerText = neonCoins;

        // Baza de date pentru magazin pe categorii/tab-uri
        let shopData = {
            skins: [
                { id: '#4af', name: 'Neon Blue', price: 0, owned: true },
                { id: 'rainbow', name: 'Rainbow', price: 0, owned: true },
                { id: 'pulse', name: 'Pulsator', price: 50, owned: localStorage.getItem('skin_pulse') === 'true' },
                { id: 'matrix', name: 'Matrix', price: 100, owned: localStorage.getItem('skin_matrix') === 'true' }
            ],
            auras: [
                { id: 'none', name: 'Fără Aură', price: 0, owned: true },
                { id: '#ff0055', name: 'Aura Roșie', price: 100, owned: localStorage.getItem('cust_aurared') === 'true' },
                { id: '#00ffcc', name: 'Aura Cyan', price: 150, owned: localStorage.getItem('cust_auracyan') === 'true' }
            ],
            particles: [
                { id: 'original', name: 'Implicit (Original)', price: 0, owned: true },
                { id: 'stars', name: 'Steluțe ⭐', price: 50, owned: localStorage.getItem('cust_stars') === 'true' },
                { id: 'hearts', name: 'Inimi ❤️', price: 80, owned: localStorage.getItem('cust_hearts') === 'true' }
            ]
        };

        function renderShop() {
            let grid = document.getElementById('shopGrid');
            grid.innerHTML = '';
            let items = shopData[activeShopTab];

            items.forEach(item => {
                let isSelected = false;
                if (activeShopTab === 'skins') isSelected = (playerSkin === item.id);
                if (activeShopTab === 'auras') isSelected = (playerAuraColor === item.id);
                if (activeShopTab === 'particles') isSelected = (playerParticleType === item.id);

                let div = document.createElement('div');
                div.className = `shop-item ${item.owned ? 'owned' : ''} ${isSelected ? 'selected' : ''}`;
                div.innerHTML = `
                    <h3 style="color:${item.id.startsWith('#') ? item.id : '#ff3'}">${item.name}</h3>
                    <p>${item.owned ? (isSelected ? 'Echipat' : 'Deținut') : '🪙 ' + item.price}</p>
                `;
                div.addEventListener('click', () => {
                    if (item.owned) {
                        if (activeShopTab === 'skins') { playerSkin = item.id; player.color = playerSkin; }
                        if (activeShopTab === 'auras') playerAuraColor = item.id;
                        if (activeShopTab === 'particles') playerParticleType = item.id;
                        renderShop();
                    } else {
                        if (neonCoins >= item.price) {
                            neonCoins -= item.price;
                            localStorage.setItem('nd_coins', neonCoins);
                            document.getElementById('coinsVal').innerText = neonCoins;
                            item.owned = true;
                            localStorage.setItem((activeShopTab === 'skins' ? 'skin_' : 'cust_') + item.id.replace('#',''), 'true');
                            if (activeShopTab === 'skins') { playerSkin = item.id; player.color = playerSkin; }
                            if (activeShopTab === 'auras') playerAuraColor = item.id;
                            if (activeShopTab === 'particles') playerParticleType = item.id;
                            renderShop();
                            playSound(950, 'sine', 0.2);
                        } else {
                            playSound(200, 'sawtooth', 0.2);
                        }
                    }
                });
                grid.appendChild(div);
            });
        }

        document.querySelectorAll('.shop-tab-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.shop-tab-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                activeShopTab = e.target.getAttribute('data-tab');
                renderShop();
            });
        });

        let records = {
            classic: localStorage.getItem('nd_rec_classic') || 0,
            survival: localStorage.getItem('nd_rec_survival') || 0,
            boss: localStorage.getItem('nd_rec_boss') || 0,
            pacman: localStorage.getItem('nd_rec_pacman') || 0,
            pvp: localStorage.getItem('nd_rec_pvp') || 0
        };

        function updateRecordDisplay() {
            document.getElementById('recordVal').innerText = records[selectedMode];
        }

        let achievementsState = {
            botHunter: localStorage.getItem('ach_botHunter') === 'true',
            survivor: localStorage.getItem('ach_survivor') === 'true',
            eliteSize: localStorage.getItem('ach_eliteSize') === 'true'
        };

        function triggerAchievement(name, text) {
            if (!achievementsState[name]) {
                achievementsState[name] = true;
                localStorage.setItem('ach_' + name, 'true');
                showAchievementPopup(text);
            }
        }

        function showAchievementPopup(text) {
            let popup = document.getElementById('achievementPopup');
            popup.innerText = "🏆 " + text;
            popup.classList.add('show');
            setTimeout(() => { popup.classList.remove('show'); }, 3500);
        }

        let screenShake = 0;
        let freezeTimer = 0;
        let dashCooldown = 0;
        const MAX_DASH_COOLDOWN = 300;
        let skillCooldown = 0;
        const MAX_SKILL_COOLDOWN = 600;
        let activeSkillTimer = 0;

        let player = {
            x: MAP_SIZE / 2, y: MAP_SIZE / 2,
            radius: 15, color: '#4af', baseSpeed: 4.5, speed: 4.5,
            vx: 0, vy: 0, angle: 0, trail: []
        };

        let bots = [];
        let pacmanGuards = [];
        let bossBot = null;
        let food = [];
        let powerups = [];
        let traps = [];
        let labirinthWalls = [];

        let menuBalls = [];
        for (let i = 0; i < 25; i++) {
            menuBalls.push({
                x: Math.random() * window.innerWidth,
                y: Math.random() * window.innerHeight,
                vx: (Math.random() - 0.5) * 2,
                vy: (Math.random() - 0.5) * 2,
                radius: Math.random() * 15 + 5,
                color: ['#4af', '#3f9', '#f36', '#ff0', '#f0f'][Math.floor(Math.random() * 5)]
            });
        }

        const translations = {
            ro: {
                mainTitle: "NEON DEVORATOR",
                langLabel: "LIMBĂ / LANGUAGE",
                btnPlayNow: "JOACĂ ACUM",
                btnOpenShop: "🛒 MAGAZIN UNIFICAT",
                optTitle: "CONFIGURARE",
                modeLabel: "MOD DE JOC",
                skillChoiceLabel: "ABILITATE SPECIALĂ",
                diffLabel: "DIFICULTATE",
                volLabel: "Volum Sunet",
                btnStartGame: "START JOC",
                scoreText: "Mărime",
                recordText: "Record",
                winTitle: "VICTORIE!",
                winSub: "Ai supraviețuit și ai dominat harta!",
                loseTitle: "GAME OVER",
                loseSub: "Ai fost devorat sau prins!",
                btnRestart: "REÎNCEARCĂ"
            },
            en: {
                mainTitle: "NEON DEVORATOR",
                langLabel: "LANGUAGE",
                btnPlayNow: "PLAY NOW",
                btnOpenShop: "🛒 SHOP",
                optTitle: "SETTINGS",
                modeLabel: "GAME MODE",
                skillChoiceLabel: "SPECIAL SKILL",
                diffLabel: "DIFFICULTY",
                volLabel: "Sound Volume",
                btnStartGame: "START GAME",
                scoreText: "Size",
                recordText: "Record",
                winTitle: "VICTORY!",
                winSub: "You survived and dominated the map!",
                loseTitle: "GAME OVER",
                loseSub: "You got eaten or caught!",
                btnRestart: "PLAY AGAIN"
            },
            es: {
                mainTitle: "NEON DEVORATOR",
                langLabel: "IDIOMA",
                btnPlayNow: "JUGAR AHORA",
                btnOpenShop: "🛒 TIENDA",
                optTitle: "AJUSTES",
                modeLabel: "MODO DE JUEGO",
                skillChoiceLabel: "HABILIDAD ESPECIAL",
                diffLabel: "DIFICULTAD",
                volLabel: "Volumen de Sonido",
                btnStartGame: "INICIAR JUEGO",
                scoreText: "Tamaño",
                recordText: "Récord",
                winTitle: "¡VICTORIA!",
                winSub: "¡Sobreviviste y dominaste el mapa!",
                loseTitle: "GAME OVER",
                loseSub: "¡Fuiste devorado o atrapado!",
                btnRestart: "JUGAR DE NUEVO"
            }
        };

        function updateTexts() {
            let t = translations[currentLang];
            document.getElementById('mainTitle').innerText = t.mainTitle;
            document.getElementById('langLabel').innerText = t.langLabel;
            document.getElementById('btnPlayNow').innerText = t.btnPlayNow;
            document.getElementById('btnOpenShop').innerText = t.btnOpenShop;
            document.getElementById('optTitle').innerText = t.optTitle;
            document.getElementById('modeLabel').innerText = t.modeLabel;
            document.getElementById('skillChoiceLabel').innerText = t.skillChoiceLabel;
            document.getElementById('diffLabel').innerText = t.diffLabel;
            document.getElementById('volLabel').innerText = `${t.volLabel}: ${Math.round(audioVolume * 100)}%`;
            document.getElementById('btnStartGame').innerText = t.btnStartGame;
            document.getElementById('uiScoreText').innerText = t.scoreText;
            document.getElementById('uiRecordText').innerText = t.recordText;
            document.getElementById('btnRestart').innerText = t.btnRestart;
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(freq, type, duration) {
            if (audioVolume <= 0) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(audioVolume * 0.2, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e){}
        }

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            minimapCanvas.width = 100;
            minimapCanvas.height = 100;
        }
        window.addEventListener('resize', resize);
        resize();

        function initEntities() {
            bots = []; pacmanGuards = []; bossBot = null; food = []; powerups = []; traps = []; labirinthWalls = []; player.trail = [];
            MAP_SIZE = selectedMode === 'survival' ? 2500 : (selectedMode === 'pacman' ? 2000 : 3000);

            let speedMult = selectedDifficulty === 'easy' ? 1.5 : (selectedDifficulty === 'mid' ? 2.5 : 4.0);

            if (selectedMode === 'pacman') {
                for (let i = 0; i < 18; i++) {
                    labirinthWalls.push({
                        x: (i * 350) % MAP_SIZE + 100,
                        y: Math.floor(i / 4) * 400 + 150,
                        w: i % 2 === 0 ? 250 : 40,
                        h: i % 2 === 0 ? 40 : 250
                    });
                }
                for (let i = 0; i < 3; i++) {
                    pacmanGuards.push({
                        x: Math.random() * (MAP_SIZE - 400) + 200,
                        y: Math.random() * (MAP_SIZE - 400) + 200,
                        radius: 20, speed: 2.2 + (i * 0.4)
                    });
                }
                for (let i = 0; i < 120; i++) {
                    food.push({
                        x: Math.random() * (MAP_SIZE - 100) + 50,
                        y: Math.random() * (MAP_SIZE - 100) + 50,
                        radius: 6, color: '#f0f'
                    });
                }
            } else if (selectedMode === 'boss') {
                bossBot = {
                    x: MAP_SIZE / 4, y: MAP_SIZE / 4,
                    radius: 70, vx: 2, vy: 2, baseSpeed: 2.0
                };
            } else if (selectedMode !== 'pvp') {
                for (let i = 0; i < (selectedMode === 'survival' ? 45 : 30); i++) {
                    let bRadius = Math.random() > 0.3 ? (Math.random() * 25 + 10) : (Math.random() * 60 + 20);
                    bots.push({
                        x: Math.random() * (MAP_SIZE - 200) + 100,
                        y: Math.random() * (MAP_SIZE - 200) + 100,
                        radius: bRadius,
                        vx: (Math.random() - 0.5) * speedMult,
                        vy: (Math.random() - 0.5) * speedMult,
                        baseSpeed: speedMult,
                        color: ['#f36', '#ff3', '#0ff', '#f90', '#3f9'][Math.floor(Math.random() * 5)]
                    });
                }
            }

            if (selectedMode !== 'pacman') {
                for (let i = 0; i < 300; i++) {
                    food.push({
                        x: Math.random() * (MAP_SIZE - 40) + 20,
                        y: Math.random() * (MAP_SIZE - 40) + 20,
                        radius: 4, color: Math.random() > 0.5 ? '#3f9' : '#fc3'
                    });
                }
            }
        }

        let joystick = { active: false, startX: 0, startY: 0, currentX: 0, currentY: 0, touchId: null };

        window.addEventListener('pointerdown', (e) => {
            if (!gameRunning || isPaused) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            if (e.clientX > window.innerWidth - 160 && e.clientY > window.innerHeight - 240) return;

            if (!joystick.active) {
                joystick.active = true;
                joystick.startX = e.clientX; joystick.startY = e.clientY;
                joystick.currentX = e.clientX; joystick.currentY = e.clientY;
                joystick.touchId = e.pointerId;
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!gameRunning || isPaused) return;
            if (e.pointerId === joystick.touchId) {
                joystick.currentX = e.clientX; joystick.currentY = e.clientY;
            }
        });

        const resetJoystickPointer = (e) => {
            if (e.pointerId === joystick.touchId) {
                joystick.active = false; joystick.touchId = null; player.vx = 0; player.vy = 0;
            }
        };
        window.addEventListener('pointerup', resetJoystickPointer);
        window.addEventListener('pointercancel', resetJoystickPointer);

        let keys = {};
        window.addEventListener('keydown', e => keys[e.key.toLowerCase()] = true);
        window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);

        document.getElementById('dashBtnWrapper').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!isPaused && dashCooldown === 0) {
                player.speed = player.baseSpeed * 2.5;
                screenShake = 8;
                playSound(600, 'square', 0.15);
                setTimeout(() => { player.speed = player.baseSpeed; }, 300);
                dashCooldown = MAX_DASH_COOLDOWN;
            }
        });

        document.getElementById('splitBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!isPaused && player.radius > 25) {
                player.radius -= 5;
                player.speed = player.baseSpeed * 3.0;
                screenShake = 10;
                playSound(500, 'sawtooth', 0.2);
                setTimeout(() => { player.speed = player.baseSpeed; }, 250);
            }
        });

        document.getElementById('freezeBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!isPaused) {
                freezeTimer = 180;
                screenShake = 15;
                playSound(800, 'sine', 0.4);
            }
        });

        document.getElementById('skillBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (!isPaused && skillCooldown === 0) {
                activeSkillTimer = 300;
                skillCooldown = MAX_SKILL_COOLDOWN;
                screenShake = 12;
                playSound(900, 'sine', 0.3);
            }
        });

        document.getElementById('pauseBtn').addEventListener('pointerdown', (e) => {
            e.preventDefault();
            if (gameRunning) {
                isPaused = true;
                document.getElementById('screen-pause').classList.remove('hidden');
            }
        });

        document.getElementById('btnResume').addEventListener('click', () => {
            isPaused = false;
            document.getElementById('screen-pause').classList.add('hidden');
        });

        document.getElementById('btnQuitToMenu').addEventListener('click', () => {
            isPaused = false;
            gameRunning = false;
            document.getElementById('screen-pause').classList.add('hidden');
            document.getElementById('screen-gameover').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
        });

        document.getElementById('btnPlayNow').addEventListener('click', () => {
            document.getElementById('screen-main').classList.add('hidden');
            document.getElementById('screen-options').classList.remove('hidden');
        });

        document.getElementById('btnOpenShop').addEventListener('click', () => {
            renderShop();
            document.getElementById('screen-main').classList.add('hidden');
            document.getElementById('screen-shop').classList.remove('hidden');
        });

        document.getElementById('btnCloseShop').addEventListener('click', () => {
            document.getElementById('screen-shop').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
        });

        document.getElementById('btnBackToMain').addEventListener('click', () => {
            document.getElementById('screen-options').classList.add('hidden');
            document.getElementById('screen-main').classList.remove('hidden');
        });

        document.getElementById('btnStartGame').addEventListener('click', () => {
            document.getElementById('screen-options').classList.add('hidden');
            startGame();
        });

        document.getElementById('btnRestart').addEventListener('click', () => {
            document.getElementById('screen-gameover').classList.add('hidden');
            startGame();
        });

        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.lang-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                currentLang = e.target.getAttribute('data-lang');
                updateTexts();
            });
        });

        document.querySelectorAll('.mode-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedMode = e.target.getAttribute('data-mode');
                updateRecordDisplay();
            });
        });

        document.querySelectorAll('.skill-choice-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.skill-choice-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedSkill = e.target.getAttribute('data-skill');
            });
        });

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                document.querySelectorAll('.diff-btn').forEach(b => b.classList.remove('active'));
                e.target.classList.add('active');
                selectedDifficulty = e.target.getAttribute('data-diff');
            });
        });

        document.getElementById('volumeSlider').addEventListener('input', (e) => {
            audioVolume = e.target.value / 100;
            updateTexts();
        });

        function startGame() {
            gameRunning = true;
            isPaused = false;
            player.x = MAP_SIZE / 2;
            player.y = MAP_SIZE / 2;
            player.radius = 15;
            player.color = playerSkin;
            initEntities();
            updateRecordDisplay();
        }

        function drawEyes(x, y, radius, angle) {
            let eyeOffset = radius * 0.35;
            let eyeRadius = Math.max(3, radius * 0.2);
            let pupilRadius = Math.max(1.5, radius * 0.1);

            let leftEyeX = x + Math.cos(angle - 0.6) * eyeOffset;
            let leftEyeY = y + Math.sin(angle - 0.6) * eyeOffset;
            let rightEyeX = x + Math.cos(angle + 0.6) * eyeOffset;
            let rightEyeY = y + Math.sin(angle + 0.6) * eyeOffset;

            ctx.beginPath();
            ctx.arc(leftEyeX, leftEyeY, eyeRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(leftEyeX + Math.cos(angle)*1.5, leftEyeY + Math.sin(angle)*1.5, pupilRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#000';
            ctx.fill();

            ctx.beginPath();
            ctx.arc(rightEyeX, rightEyeY, eyeRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#fff';
            ctx.fill();
            ctx.beginPath();
            ctx.arc(rightEyeX + Math.cos(angle)*1.5, rightEyeY + Math.sin(angle)*1.5, pupilRadius, 0, Math.PI * 2);
            ctx.fillStyle = '#000';
            ctx.fill();
        }

        function gameLoop() {
            animationFrame = requestAnimationFrame(gameLoop);

            if (!gameRunning) {
                ctx.fillStyle = '#05050f';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                menuBalls.forEach(b => {
                    b.x += b.vx; b.y += b.vy;
                    if (b.x < 0 || b.x > canvas.width) b.vx *= -1;
                    if (b.y < 0 || b.y > canvas.height) b.vy *= -1;
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = b.color;
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = b.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                });
                return;
            }

            if (isPaused) return;

            if (dashCooldown > 0) dashCooldown--;
            if (skillCooldown > 0) skillCooldown--;
            if (activeSkillTimer > 0) activeSkillTimer--;
            if (freezeTimer > 0) freezeTimer--;

            let dashPct = (dashCooldown / MAX_DASH_COOLDOWN) * 182.2;
            document.getElementById('dashProgress').style.strokeDashoffset = dashPct;

            let nextX = player.x;
            let nextY = player.y;

            if (joystick.active) {
                let dx = joystick.currentX - joystick.startX;
                let dy = joystick.currentY - joystick.startY;
                let dist = Math.hypot(dx, dy);
                if (dist > 5) {
                    let angle = Math.atan2(dy, dx);
                    player.angle = angle;
                    nextX += Math.cos(angle) * player.speed;
                    nextY += Math.sin(angle) * player.speed;
                }
            }

            if (keys['w'] || keys['arrowup']) { nextY -= player.speed; player.angle = -Math.PI/2; }
            if (keys['s'] || keys['arrowdown']) { nextY += player.speed; player.angle = Math.PI/2; }
            if (keys['a'] || keys['arrowleft']) { nextX -= player.speed; player.angle = Math.PI; }
            if (keys['d'] || keys['arrowright']) { nextX += player.speed; player.angle = 0; }

            let canMove = true;
            if (selectedMode === 'pacman') {
                for (let w of labirinthWalls) {
                    if (nextX + player.radius > w.x && nextX - player.radius < w.x + w.w &&
                        nextY + player.radius > w.y && nextY - player.radius < w.y + w.h) {
                        canMove = false;
                        break;
                    }
                }
            }

            if (canMove) {
                player.x = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, nextX));
                player.y = Math.max(player.radius, Math.min(MAP_SIZE - player.radius, nextY));
            }

            // Urma clasică (Trail din codul tău original)
            player.trail.push({ x: player.x, y: player.y, radius: player.radius, alpha: 0.6 });
            if (player.trail.length > 8) player.trail.shift();

            ctx.fillStyle = '#05050f';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Desenează Urma / Trail-ul din spate (Original)
            player.trail.forEach(t => {
                t.alpha -= 0.05;
                if (t.alpha > 0) {
                    let tScreenX = t.x - player.x + canvas.width / 2;
                    let tScreenY = t.y - player.y + canvas.height / 2;
                    
                    if (playerParticleType === 'original') {
                        ctx.beginPath();
                        ctx.arc(tScreenX, tScreenY, t.radius * 0.8, 0, Math.PI * 2);
                        ctx.fillStyle = `rgba(74, 175, 255, ${t.alpha * 0.4})`;
                        ctx.fill();
                    } else {
                        ctx.font = '14px sans-serif';
                        ctx.fillStyle = playerParticleType === 'stars' ? '#ff3' : '#f36';
                        ctx.fillText(playerParticleType === 'stars' ? '⭐' : '❤️', tScreenX, tScreenY);
                    }
                }
            });

            // Labirint Pac-Man
            if (selectedMode === 'pacman') {
                ctx.strokeStyle = '#f0f';
                ctx.lineWidth = 4;
                ctx.shadowBlur = 12;
                ctx.shadowColor = '#f0f';
                for (let w of labirinthWalls) {
                    ctx.strokeRect(w.x - player.x + canvas.width / 2, w.y - player.y + canvas.height / 2, w.w, w.h);
                }
                ctx.shadowBlur = 0;
            }

            // Mâncare
            food.forEach((f, index) => {
                let screenX = f.x - player.x + canvas.width / 2;
                let screenY = f.y - player.y + canvas.height / 2;

                if (Math.hypot(player.x - f.x, player.y - f.y) < player.radius + f.radius) {
                    food.splice(index, 1);
                    player.radius += selectedMode === 'pacman' ? 0.5 : 0.2;
                    neonCoins += 1;
                    localStorage.setItem('nd_coins', neonCoins);
                    document.getElementById('coinsVal').innerText = neonCoins;
                    playSound(1000, 'sine', 0.1);
                }

                ctx.beginPath();
                ctx.arc(screenX, screenY, f.radius, 0, Math.PI * 2);
                ctx.fillStyle = f.color;
                ctx.fill();
            });

            // Boți normali
            if (selectedMode !== 'pacman' && selectedMode !== 'boss') {
                bots.forEach((b, index) => {
                    b.x += b.vx;
                    b.y += b.vy;

                    if (b.x < b.radius || b.x > MAP_SIZE - b.radius) b.vx *= -1;
                    if (b.y < b.radius || b.y > MAP_SIZE - b.radius) b.vy *= -1;

                    let distToPlayer = Math.hypot(player.x - b.x, player.y - b.y);
                    if (b.radius > player.radius * 1.1 && distToPlayer < 350) {
                        let angle = Math.atan2(player.y - b.y, player.x - b.x);
                        b.x += Math.cos(angle) * (b.baseSpeed * 0.4);
                        b.y += Math.sin(angle) * (b.baseSpeed * 0.4);
                    }

                    if (distToPlayer < player.radius + b.radius) {
                        if (player.radius > b.radius * 1.05) {
                            player.radius += b.radius * 0.3;
                            bots.splice(index, 1);
                            playSound(1200, 'sine', 0.2);
                        } else if (b.radius > player.radius * 1.05) {
                            gameRunning = false;
                            document.getElementById('gameOverTitle').innerText = translations[currentLang].loseTitle;
                            document.getElementById('gameOverSub').innerText = "Ai fost mâncat de un bot mai mare!";
                            document.getElementById('screen-gameover').classList.remove('hidden');
                        }
                    }

                    let bScreenX = b.x - player.x + canvas.width / 2;
                    let bScreenY = b.y - player.y + canvas.height / 2;

                    ctx.beginPath();
                    ctx.arc(bScreenX, bScreenY, b.radius, 0, Math.PI * 2);
                    ctx.fillStyle = b.color;
                    ctx.fill();

                    let bAngle = Math.atan2(b.vy, b.vx);
                    drawEyes(bScreenX, bScreenY, b.radius, bAngle);
                });
            }

            // Gardieni în mod Pacman
            if (selectedMode === 'pacman') {
                pacmanGuards.forEach(g => {
                    let angle = Math.atan2(player.y - g.y, player.x - g.x);
                    g.x += Math.cos(angle) * g.speed;
                    g.y += Math.sin(angle) * g.speed;

                    let gScreenX = g.x - player.x + canvas.width / 2;
                    let gScreenY = g.y - player.y + canvas.height / 2;

                    ctx.beginPath();
                    ctx.arc(gScreenX, gScreenY, g.radius, 0, Math.PI * 2);
                    ctx.fillStyle = '#ff0033';
                    ctx.shadowBlur = 15;
                    ctx.shadowColor = '#ff0033';
                    ctx.fill();
                    ctx.shadowBlur = 0;

                    drawEyes(gScreenX, gScreenY, g.radius, angle);

                    if (Math.hypot(player.x - g.x, player.y - g.y) < player.radius + g.radius) {
                        gameRunning = false;
                        document.getElementById('gameOverTitle').innerText = translations[currentLang].loseTitle;
                        document.getElementById('gameOverSub').innerText = "Ai fost prins de gardianul roșu!";
                        document.getElementById('screen-gameover').classList.remove('hidden');
                    }
                });
            }

            // Aură personalizată
            if (activeSkillTimer > 0 && playerAuraColor !== 'none') {
                ctx.beginPath();
                ctx.arc(canvas.width / 2, canvas.height / 2, player.radius + 12, 0, Math.PI * 2);
                ctx.strokeStyle = playerAuraColor;
                ctx.lineWidth = 4;
                ctx.shadowBlur = 25;
                ctx.shadowColor = playerAuraColor;
                ctx.stroke();
                ctx.shadowBlur = 0;
            }

            // Jucător
            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, player.radius, 0, Math.PI * 2);
            ctx.fillStyle = player.color;
            ctx.shadowBlur = 20;
            ctx.shadowColor = player.color;
            ctx.fill();
            ctx.shadowBlur = 0;

            drawEyes(canvas.width / 2, canvas.height / 2, player.radius, player.angle || 0);

            // Minimap
            mCtx.fillStyle = '#05050f';
            mCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            let scaleM = minimapCanvas.width / MAP_SIZE;
            bots.forEach(b => {
                mCtx.fillStyle = b.color;
                mCtx.fillRect(b.x * scaleM, b.y * scaleM, 2, 2);
            });
            mCtx.fillStyle = '#4af';
            mCtx.fillRect(player.x * scaleM, player.y * scaleM, 4, 4);

            document.getElementById('scoreVal').innerText = Math.floor(player.radius);

            if (player.radius >= 200 || (selectedMode === 'pacman' && food.length === 0)) {
                gameRunning = false;
                document.getElementById('gameOverTitle').innerText = translations[currentLang].winTitle;
                document.getElementById('gameOverSub').innerText = translations[currentLang].winSub;
                document.getElementById('screen-gameover').classList.remove('hidden');
                triggerAchievement('eliteSize', 'Elite Size: Ai dominat harta!');
            }
        }

        gameLoop();
    </script>
</body>
</html>
